name: Build AutoMe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autome-mod
          path: build/libs/autome-*.jar
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/autome-*.jar
          body: |
            ## AutoMe v1.0.2

            修复聊天前缀为命令时无法正确发送，以及通过 /autome setprefix 设置斜杠前缀的问题。

            ### 安装
            1. 适用于 Minecraft Java 1.21.1 与 Fabric。
            2. 安装匹配版本的 Fabric Loader 和 Fabric API。
            3. 将下载的 autome-1.0.2.jar 放入 mods 文件夹。

            ### 常用命令
            - /autome on 启用
            - /autome off 禁用
            - /autome set /me 设置前缀
            - /autome setprefix 将下一条输入设为前缀
            - /autome status 查看状态
